name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Update npm
        run: |
          npm install -g npm@11
          npm --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Build
        run: bun run build

      - name: Verify tag matches package version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            # Manual dispatch: the release tag is derived from the package version.
            TAG="v${VERSION}"
            echo "Manual run: expecting tag v${VERSION}"
          fi

          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${VERSION}"
            exit 1
          fi
          echo "Tag ${TAG} matches package.json version ${VERSION}"

      - name: Verify repository metadata
        run: |
          EXPECTED="git+https://github.com/${GITHUB_REPOSITORY}.git"
          ACTUAL="$(node -p "require('./package.json').repository.url")"
          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo "::error::repository.url ${ACTUAL} does not match ${EXPECTED}"
            exit 1
          fi
          echo "repository.url matches ${EXPECTED}"

      - name: Check if version is already published
        id: published
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "::notice::${NAME}@${VERSION} is already published; skipping npm publish."
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Configure npm auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm config set '//registry.npmjs.org/:_authToken' "${NODE_AUTH_TOKEN}"

      - name: Stage npm release
        if: steps.published.outputs.exists != 'true'
        run: npm stage publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
